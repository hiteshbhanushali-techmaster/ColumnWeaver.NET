name: Build and publish NuGet package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore package project
        run: dotnet restore ColumnWeaver.NET/ColumnWeaver.NET.csproj

      - name: Build NuGet package
        run: dotnet pack ColumnWeaver.NET/ColumnWeaver.NET.csproj --configuration Release --no-restore --output artifacts -m:1

      - name: Exchange GitHub OIDC token for a temporary NuGet key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: HiteshBhanushali-Techmaster

      - name: Publish package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/ColumnWeaver.NET.1.0.1-beta.nupkg" --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
